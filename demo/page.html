<title>مخزون حي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* شاشة التحميل: تظهر فورًا حتى تجهز قاعدة البيانات داخل المتصفح */
  .boot {
    min-height: 70vh;
    display: grid;
    place-items: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .boot-card {
    width: min(440px, 100%);
    background: rgb(var(--surface));
    border: 1px solid rgb(var(--line));
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .boot-brand { display: flex; align-items: center; gap: 12px; }
  .boot-logo {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    background: rgb(var(--brand)); color: rgb(var(--brand-ink));
    display: grid; place-items: center;
  }
  .boot-logo svg { width: 24px; height: 24px; }
  .boot-name { font-family: var(--font-display), var(--font-body), system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: rgb(var(--ink)); }
  .boot-sub { font-size: 13px; color: rgb(var(--muted)); }
  .boot-track { height: 6px; border-radius: 3px; background: rgb(var(--sunk)); overflow: hidden; }
  .boot-bar { height: 100%; width: 4%; background: rgb(var(--brand)); transition: width .2s ease-out; }
  .boot-status { font-size: 14px; color: rgb(var(--ink)); }
  .boot-detail { font-size: 12px; color: rgb(var(--muted)); }
  .boot-failed .boot-track { display: none; }
  .boot-failed .boot-status { color: rgb(var(--crit-ink)); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .boot-bar { transition: none; } }
</style>
<div id="app" dir="rtl" lang="ar">
  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-brand">
        <span class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13M8.3 8.3a5 5 0 0 0 0 7.4M15.7 8.3a5 5 0 0 1 0 7.4"/></svg>
        </span>
        <div>
          <div class="boot-name">مخزون حي</div>
          <div class="boot-sub">جرد لحظي بتقنية RFID مع تنبؤ ذكي بالطلب</div>
        </div>
      </div>
      <div class="boot-track"><div class="boot-bar" id="boot-bar"></div></div>
      <div class="boot-status" id="boot-status">تجهيز المنصة…</div>
      <div class="boot-detail" id="boot-detail">تشتغل المنصة كاملة داخل متصفحك مع قاعدة بيانات Postgres (حوالي 7 ميجابايت في أول تحميل).</div>
    </div>
  </div>
</div>
<script src="assets/app.js" defer></script>
